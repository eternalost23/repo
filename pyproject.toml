[project]
name = "todo-app-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.7",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.ruff]
# Под какую версию Python проверять синтаксис и правила
target-version = "py314"
# Максимальная длина строки
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Использовать двойные кавычки
quote-style = "double"
# Использовать пробелы вместо табов
indent-style = "space"
# Оставлять "магические" висячие запятые для удобного переноса строк
skip-magic-trailing-comma = false
# Автоматически выбрать стиль перевода строк под среду/файл
line-ending = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]


[tool.mypy]
# Какие каталоги проверять по умолчанию
files = ["app"]
# Под какую версию Python проверять типы
python_version = "3.14"
# Проверять даже тела функций без полной типизации
check_untyped_defs = true
# Показывать коды ошибок рядом с сообщениями
show_error_codes = true
# Предупреждать о лишних type: ignore
warn_unused_ignores = true
# Не падать на внешних библиотеках без type stubs
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
